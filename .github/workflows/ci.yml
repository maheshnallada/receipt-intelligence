name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MODEL_BACKEND: dummy
      LOGFIRE_SEND_TO_LOGFIRE: "false"
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Samples
        run: python scripts/generate_samples.py
      - name: Lint
        run: python -m ruff check app tests scripts eval training
      - name: Test
        run: python -m pytest -q
