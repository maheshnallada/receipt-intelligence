[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-extraction"
version = "1.0.0"
description = "Receipt extraction with a small VLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<0.129.0",
    "uvicorn[standard]>=0.32.0,<0.38.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "python-multipart>=0.0.18",
    "pymupdf>=1.25.0,<1.27.0",
    "pillow>=11.0.0,<12.0.0",
    "cachetools>=5.5.0,<6.0.0",
    "redis>=5.2.0,<6.1.0",
    "httpx>=0.28.0,<0.29.0",
    "logfire[fastapi]>=3.0.0,<5.0.0",
    "pytesseract>=0.3.13",
    "json-repair>=0.39.0,<0.50.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
train = [
    "torch>=2.4.0",
    "transformers>=4.49.0",
    "peft>=0.14.0",
    "trl>=0.14.0",
    "bitsandbytes>=0.45.0",
    "datasets>=3.2.0",
    "accelerate>=1.2.0",
    "wandb>=0.19.0",
    "qwen-vl-utils>=0.0.10",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[tool.setuptools.packages.find]
include = ["app*", "eval*", "training*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
